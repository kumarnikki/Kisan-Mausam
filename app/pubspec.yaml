name: kisan_mausam
description: "KisanMausam: Hindi-first weather and crop-protection mobile app for Indian farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  google_fonts: ^6.2.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  google_sign_in: ^6.2.2
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
