services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisan-mausam-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - kisan_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kisan-mausam-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  kisan_data:
